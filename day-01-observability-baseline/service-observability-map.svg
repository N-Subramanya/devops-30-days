<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="994" viewBox="0 0 1000 994" role="img" aria-label="Service observability map: Users → Ingress → Payment API → Database, each emitting metrics, logs and traces that are collected by Prometheus, Fluent Bit to Loki and OpenTelemetry to Tempo, and correlated in Grafana">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; fill: #111111; }
    .title { font-size: 18px; font-weight: 600; }
    .tile-title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 15px; fill: #4B5563; }
    .sub-sm { font-size: 13px; fill: #4B5563; }
    .label { font-size: 12px; font-weight: 600; fill: #6B7280; letter-spacing: 1.5px; }
    .pill { font-size: 12px; font-weight: 600; }
    .card { fill: #FFFFFF; stroke: #DDDDDD; stroke-width: 1; }
    .tile { fill: #F3F4F6; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #6B7280; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .m-bg { fill: #DCFCE7; } .m-tx { fill: #166534; }
    .l-bg { fill: #FFEDD5; } .l-tx { fill: #9A3412; }
    .t-bg { fill: #F3E8FF; } .t-tx { fill: #6B21A8; }
  </style>

  <!-- container -->
  <rect x="4" y="4" width="992" height="986" rx="14" fill="#FCFCFC" stroke="#E5E5E5"/>

  <!-- ============ SERVICE ARCHITECTURE ============ -->

  <!-- users -->
  <rect class="card" x="24" y="24" width="952" height="58" rx="10"/>
  <text class="title" x="500" y="59">Users</text>

  <path class="arrow" d="M500 92v14M495 101l5 5 5-5"/>

  <!-- ingress -->
  <rect class="card" x="24" y="118" width="952" height="86" rx="10"/>
  <text class="title" x="500" y="152">Ingress / Application Gateway</text>
  <text class="sub" x="500" y="182">Availability · HTTP errors · TLS failures</text>
  <rect class="m-bg" x="820" y="132" width="66" height="22" rx="11"/><text class="pill m-tx" x="853" y="147">metrics</text>
  <rect class="l-bg" x="892" y="132" width="66" height="22" rx="11"/><text class="pill l-tx" x="925" y="147">logs</text>

  <path class="arrow" d="M500 214v14M495 223l5 5 5-5"/>

  <!-- payment api -->
  <rect class="card" x="24" y="240" width="952" height="176" rx="10"/>
  <text class="title" x="500" y="274">Payment API — Kubernetes Deployment</text>
  <text class="sub" x="500" y="302">Request rate · Error rate · p95 latency</text>
  <rect class="m-bg" x="748" y="254" width="66" height="22" rx="11"/><text class="pill m-tx" x="781" y="269">metrics</text>
  <rect class="l-bg" x="820" y="254" width="66" height="22" rx="11"/><text class="pill l-tx" x="853" y="269">logs</text>
  <rect class="t-bg" x="892" y="254" width="66" height="22" rx="11"/><text class="pill t-tx" x="925" y="269">traces</text>
  <line x1="40" y1="322" x2="960" y2="322" stroke="#EEEEEE"/>
  <rect class="tile" x="40" y="338" width="300" height="60" rx="8"/>
  <text class="tile-title" x="190" y="362">Pod health</text>
  <text class="sub-sm" x="190" y="384">Restarts · Readiness</text>
  <rect class="tile" x="350" y="338" width="300" height="60" rx="8"/>
  <text class="tile-title" x="500" y="362">Resources</text>
  <text class="sub-sm" x="500" y="384">CPU / memory</text>
  <rect class="tile" x="660" y="338" width="300" height="60" rx="8"/>
  <text class="tile-title" x="810" y="362">App errors</text>
  <text class="sub-sm" x="810" y="384">Exceptions</text>

  <path class="arrow" d="M500 426v14M495 435l5 5 5-5"/>

  <!-- database -->
  <rect class="card" x="24" y="452" width="952" height="86" rx="10"/>
  <text class="title" x="500" y="486">Database</text>
  <text class="sub" x="500" y="514">Query latency · Connections · Errors</text>
  <rect class="m-bg" x="820" y="466" width="66" height="22" rx="11"/><text class="pill m-tx" x="853" y="481">metrics</text>
  <rect class="l-bg" x="892" y="466" width="66" height="22" rx="11"/><text class="pill l-tx" x="925" y="481">logs</text>

  <!-- ============ COLLECTION ============ -->
  <line x1="24" y1="562" x2="976" y2="562" stroke="#E5E5E5"/>
  <text class="label" x="500" y="590">COLLECT</text>

  <!-- metrics -->
  <rect class="card" x="24" y="606" width="308" height="150" rx="10"/>
  <g class="icon" stroke="#16A34A" transform="translate(166 616)">
    <path d="M4 20v-5M9 20v-8M14 20v-6M19 20V9"/>
    <path d="M4 11l5-4 5 3 6-6"/>
    <path d="M16 4h4v4"/>
  </g>
  <text class="title" x="178" y="662">Metrics</text>
  <text class="sub-sm" x="178" y="688">/metrics · kube-state-metrics</text>
  <text class="sub-sm" x="178" y="708">node-exporter · postgres-exporter</text>
  <text class="pill m-tx" x="178" y="738" style="font-size:14px">Prometheus (scrape)</text>

  <!-- logs -->
  <rect class="card" x="346" y="606" width="308" height="150" rx="10"/>
  <g class="icon" stroke="#EA8A0C" transform="translate(488 616)">
    <path d="M15 12h-5"/>
    <path d="M15 8h-5"/>
    <path d="M19 17V5a2 2 0 0 0-2-2H4"/>
    <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>
  </g>
  <text class="title" x="500" y="662">Logs</text>
  <text class="sub-sm" x="500" y="688">Container stdout (JSON + trace_id)</text>
  <text class="sub-sm" x="500" y="708">Ingress access logs · DB logs</text>
  <text class="pill l-tx" x="500" y="738" style="font-size:14px">Fluent Bit → Loki</text>

  <!-- traces -->
  <rect class="card" x="668" y="606" width="308" height="150" rx="10"/>
  <g class="icon" stroke="#9333EA" transform="translate(810 616)">
    <circle cx="7" cy="16" r="3.5"/>
    <circle cx="17" cy="8" r="3.5"/>
    <path d="M9.8 13.8l4.4-3.6"/>
  </g>
  <text class="title" x="822" y="662">Traces</text>
  <text class="sub-sm" x="822" y="688">OpenTelemetry SDK in Payment API</text>
  <text class="sub-sm" x="822" y="708">W3C traceparent from Ingress</text>
  <text class="pill t-tx" x="822" y="738" style="font-size:14px">OTel Collector → Tempo</text>

  <!-- converge into grafana -->
  <path class="arrow" d="M178 766v14M173 775l5 5 5-5"/>
  <path class="arrow" d="M500 766v14M495 775l5 5 5-5"/>
  <path class="arrow" d="M822 766v14M817 775l5 5 5-5"/>

  <!-- ============ GRAFANA ============ -->
  <rect class="card" x="24" y="792" width="952" height="178" rx="10"/>
  <g class="icon" stroke="#111111" transform="translate(488 804)">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M7 14l3-3 3 3 4-5"/>
  </g>
  <text class="title" x="500" y="850">Grafana</text>
  <text class="sub" x="500" y="878">Dashboards · Explore · Alert visibility</text>
  <rect class="m-bg" x="238" y="896" width="164" height="26" rx="13"/><text class="pill m-tx" x="320" y="913">Prometheus data source</text>
  <rect class="l-bg" x="418" y="896" width="164" height="26" rx="13"/><text class="pill l-tx" x="500" y="913">Loki data source</text>
  <rect class="t-bg" x="598" y="896" width="164" height="26" rx="13"/><text class="pill t-tx" x="680" y="913">Tempo data source</text>
  <text class="sub-sm" x="500" y="950">Correlate: metric spike → exemplar trace in Tempo → logs for that trace_id in Loki</text>
</svg>
